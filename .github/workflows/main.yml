name: Zip to APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'RobloxExecutor.zip'
      - '**.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract zip
        run: |
          echo "Looking for zip files..."
          ls -la
          ZIP=$(find . -maxdepth 2 -name "*.zip" | head -1)
          if [ -z "$ZIP" ]; then
            echo "No zip found!"
            exit 1
          fi
          echo "Found: $ZIP"
          unzip -o "$ZIP" -d extracted
          ls -la extracted/
          # หาโฟลเดอร์โปรเจกต์
          if [ -d extracted/RobloxExecutor ]; then
            mv extracted/RobloxExecutor project
          else
            # กรณี zip ไม่มีโฟลเดอร์หุ้ม
            mkdir -p project
            mv extracted/* project/ 2>/dev/null || true
          fi
          ls -la project/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Gradle Wrapper
        working-directory: project
        run: |
          # ติดตั้ง gradle ถ้ายังไม่มี
          if ! command -v gradle &> /dev/null; then
            wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
            unzip -q gradle-8.7-bin.zip
            export PATH=$PATH:$(pwd)/gradle-8.7/bin
          fi
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: project
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXRA-Executor-APK
          path: project/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Show result
        run: |
          echo "=== APK Ready ==="
          find project/app/build/outputs -name "*.apk" -exec ls -lh {} \;
